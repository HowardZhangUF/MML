# environment structure
number_agents: 1  # number of agents
number_targets: 2  # number of targets
number_obstacles: 0  # number of obstacles
env_size: 1024  # size of the sim environment
dt: 0.05  # time step size for sim
number_sim_steps: 5000   # number of steps to take for the sim
max_lin_velx: 0.6  # max speed along x axis (meters/second)
max_lin_vely: 0.6  # max speed along y axis (meters/second)
max_ang_vel: 5.  # max angular speed about z axis (radians/second)
target_lin_scale: 0.5  # how much to scale the targets speeds

# ICL parameters
Delta_t_theta: 1.0  # integration window
k_theta: 1.0  # outer gain
Gamma_theta: 0.01  # outer gain
lambda_1: 0.001  # minimum eigenvalue

# initial conditions - ALL IN METERS (origin at center, -3 to +3 range)
eta: [1.5, -0.5]  # initial agent state (was [800, 200] pixels)
z: [-2.0, 1.5]  # initial target state (was [100, 800] pixels)
use_initial_conditions: True  # should you used conditions for initial

# target dnn structure
p_z: 256  # output size
h_z: 64  # hidden size

# agent dnn structure
p_eta: 16  # output size
h_eta: 64  # hidden size

# dnn training
initial_model: "None"
lr_max: 0.001   # learning rate max
lr_min: 0.0001   # learning rate min

# adp actor critic parameters
n: 2  # state size [position and velocity]
m_eta: 2  # [linear]

k_c1: 0.9  # gain on critic on trajectory
k_c2: 0.1  # gain on critic off trajectory
# k_a1: 10.0  # gain on difference between Wa and Wc
k_a1: 0.25  # Pats gain on difference between Wa and Wc
# k_a2: 0.1  # gain on Wa
k_a2: 0.005  # Pats gain on Wa
k_nu: 1.0  # gain for staf
# beta_c: 0.05  # gain for Gamma on Gamma
beta_c: 0.001  # Pats gain for Gamma on Gamma
gamma_1: 0.75  # gain for normalization factor

# k_c1: 0.005 # gain on critic on trajectory
# k_c2: 0.1 # gain on critic off trajectory
# k_a1: 10.0 # gain on difference between Wa and Wc
# k_a2: 0.1 # gain on Wa
# k_nu: 0.05 # gain for staf
# beta_c: 0.4 # gain for Gamma on Gamma
# gamma_1: 0.005 # gain for normalization factor

N: 10  # number of extrapolation points
Q_e_z: [0.0001, 0.0001]  # state cost for each block
Q_e_d: [0.0001, 0.0001]  # state cost for each block
Q_e_eta: [0.0001, 0.0001]  # state cost for each block
R: 0.01  # input cost for each block
k_d: 1.3  # gain on target error
r: 100  # radius of ball around state for extrapolation
K_a: 1.0  # gain for actor
f_scale: 1.0 
